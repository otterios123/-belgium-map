<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdfcf7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Belgium">
<title>Belgium map · 9–12 Oct</title>
<link rel="preconnect" href="https://tiles.openfreemap.org">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{
  --sheet-h:160px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --paper:#fdfcf7;--paper-ink:#1e3a8a;--paper-text:#18181b;--paper-muted:#52525b;
  --rule:#dde6ef;--margin:#e7aeaa;--star:#c2410c;
  --hand:Calibri,Carlito,'Segoe UI',system-ui,-apple-system,sans-serif;
  --print:Calibri,Carlito,'Segoe UI',system-ui,-apple-system,sans-serif;
}
body[data-theme=day]{--ui:#fdfcf7;--ui2:#f0ede3;--ink:#1e3a8a;--text:#1d1d21;--muted:#6b6a70;--line:rgba(30,58,138,.16);--sh:0 4px 16px rgba(50,45,30,.18);--hud:#1e3a8a;--hud-t:#fdfcf7;--accent:#2d5bd8;--ok:#15803d;--no:#c2410c}
body[data-theme=slate]{--ui:#33413c;--ui2:#3f4f49;--ink:#e6efe9;--text:#f0f5f2;--muted:#a9bbb2;--line:rgba(228,238,232,.18);--sh:0 4px 16px rgba(0,0,0,.35);--hud:#1e2526;--hud-t:#ffd166;--accent:#ffd166;--ok:#8fe0a8;--no:#ffb08a;--paper:#efebdc}
body[data-theme=night]{--ui:#191b1e;--ui2:#25282c;--ink:#e6e8eb;--text:#f2f3f5;--muted:#8f959d;--line:rgba(255,255,255,.13);--sh:0 4px 16px rgba(0,0,0,.55);--hud:#25282d;--hud-t:#f2f3f5;--accent:#6f98ff;--ok:#7ddc9a;--no:#ff9f7a;--paper:#e9e4d3}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ui);font-family:var(--print);color:var(--text);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#map{position:fixed;inset:0}
.maplibregl-ctrl-bottom-left{bottom:calc(var(--sheet-h) + 2px)!important}
.maplibregl-ctrl-attrib{font-family:system-ui,sans-serif;font-size:10px}
.ico{width:22px;height:22px;fill:currentColor;flex:none}

/* top */
#top{position:fixed;top:calc(var(--safe-t) + 10px);left:10px;right:10px;z-index:20;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:560px}
#top>*{pointer-events:auto}
.search{display:flex;align-items:center;gap:8px;background:var(--ui);color:var(--muted);border-radius:14px;box-shadow:var(--sh);padding:0 4px 0 12px;height:46px}
.search input{flex:1;border:0;background:transparent;font:inherit;font-size:18px;color:var(--text);outline:none;min-width:0}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
.search button{border:0;background:none;width:38px;height:38px;border-radius:10px;color:var(--muted);font-size:24px;line-height:1}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 0 6px;margin-bottom:-6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:17px;background:var(--ui);color:var(--text);box-shadow:var(--sh);border:0;font-size:17px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.results{background:var(--ui);border-radius:14px;box-shadow:var(--sh);max-height:52vh;overflow-y:auto;padding:4px 14px}
.results h5{font-family:var(--hand);font-size:16px;margin:8px 0 0;color:var(--ink);font-weight:700}
.results .empty{padding:10px 0;color:var(--muted)}

/* side buttons */
#rail{position:fixed;right:10px;top:calc(var(--safe-t) + 110px);z-index:18;display:flex;flex-direction:column;gap:10px}
.fab{width:46px;height:46px;border-radius:50%;border:0;background:var(--ui);color:var(--ink);box-shadow:var(--sh);display:grid;place-items:center}
#btnNorth svg{transition:transform .2s}
#btnLocate{position:fixed;right:12px;bottom:calc(var(--sheet-h) + 14px);z-index:18;width:56px;height:56px;transition:bottom .28s cubic-bezier(.2,.8,.2,1)}
#btnLocate.on{color:var(--accent)}
#btnLocate.head{background:var(--accent);color:var(--ui)}
body[data-theme=day] #btnLocate.head{color:#fff}

/* sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;z-index:15;background:var(--ui);color:var(--text);border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;will-change:transform}
#sheet.gone{transform:translateY(110%)!important}
.grab{padding:8px 18px 0;touch-action:none;user-select:none;-webkit-user-select:none}
.handle{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 6px}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line)}
.tab{font-family:var(--hand);font-size:20px;font-weight:700;border:0;background:none;color:var(--muted);padding:0 0 4px;margin-bottom:-1px;border-bottom:2px solid transparent;line-height:1.1}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--ink)}
.sbody{flex:1;overflow-y:auto;padding:6px 18px calc(var(--safe-b) + 24px);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0 4px}
.filters::-webkit-scrollbar{display:none}
.flt{flex:none;border:1.4px solid var(--line);background:none;border-radius:15px;padding:3px 12px;font-size:16px;color:var(--muted)}
.flt[aria-pressed=true]{border-color:var(--ink);color:var(--ink)}
.ref{font-size:15px;color:var(--muted);margin:4px 0 0}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row .dot{width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none;font-size:15px}
.row .dot svg{width:16px;height:16px;fill:#fff}
.row .mid{min-width:0;flex:1}
.row .nm{font-size:19px;line-height:1.15;color:var(--text)}
.row .sub{font-size:15px;color:var(--muted);line-height:1.2}
.row .d{text-align:right;font-size:16px;white-space:nowrap;color:var(--text)}
.row .d small{display:block;font-size:14px;color:var(--muted)}
.st-open{color:var(--ok)}.st-closed{color:var(--no)}
.time{font-family:var(--hand);font-weight:700;font-size:16px;width:46px;flex:none;color:var(--ink)}

/* plans */
.plan{padding:14px 0;border-bottom:1px dashed var(--line)}
.plan h3{font-family:var(--hand);font-size:22px;font-weight:700;line-height:1;margin:0;color:var(--ink);display:flex;align-items:center;gap:9px}
.plan h3 i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.plan p{margin:4px 0 10px;font-size:16px;color:var(--muted);line-height:1.3}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1.5px solid var(--ink);background:none;color:var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;padding:6px 14px;font-size:17px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.fill{background:var(--ink);color:var(--ui)}
.back{border:0;background:none;color:var(--muted);font-size:17px;padding:8px 0 0}

/* notes tab */
.notes h4{font-family:var(--hand);font-size:19px;font-weight:700;color:var(--ink);margin:16px 0 2px;line-height:1.1}
.notes p{margin:0 0 6px;font-size:17px;line-height:1.4}
.notes .warn{color:var(--no)}
.notes .warn::before{content:"↳ "}
.notes a{color:var(--ink)}
.notes table{width:100%;border-collapse:collapse;font-size:15px;margin:4px 0 6px}
.notes th,.notes td{border-top:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}
.notes th{font-family:var(--hand);font-size:16px;color:var(--ink)}
.notes .fine{font-size:14px;color:var(--muted);margin-top:18px}

/* pins */
.mk{cursor:pointer}
.pin{position:relative;width:30px;height:30px;border-radius:50% 50% 50% 5px;transform:rotate(-45deg);background:var(--c);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center;transition:transform .15s}
.pin-in{transform:rotate(45deg);color:#fff;display:grid;place-items:center;font-family:var(--print);font-size:15px;line-height:1}
.pin-in svg{width:15px;height:15px;fill:#fff}
.mkstar{position:absolute;top:-9px;right:-7px;font-size:14px;line-height:1;color:var(--star);text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff;pointer-events:none}
.mk.sel .pin{transform:rotate(-45deg) scale(1.3)}
.mk.sel{z-index:5}
.mk.dim{opacity:.38}
.mk.inplan{z-index:3}
body.far .pin{transform:rotate(-45deg) scale(.62)}
body.far .pin-in{opacity:0}
body.far .mkstar{display:none}
.pin.temp{background:var(--paper);border:2.5px solid var(--paper-ink)}
.pin.temp .pin-in{color:var(--paper-ink)}

/* me */
.me{width:68px;height:68px;position:relative;pointer-events:none}
.me svg{position:relative;width:68px;height:68px;filter:drop-shadow(0 0 1.5px rgba(255,255,255,.9)) drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.me::before{content:"";position:absolute;left:-6px;right:-6px;bottom:-4px;height:22px;border-radius:50%;background:rgba(45,91,216,.32);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.cone{width:150px;height:150px;border-radius:50%;pointer-events:none;background:conic-gradient(from -32deg,rgba(45,91,216,.55) 0deg 64deg,transparent 64deg);-webkit-mask:radial-gradient(circle,#000 16%,transparent 68%);mask:radial-gradient(circle,#000 16%,transparent 68%)}
body[data-theme=slate] .cone{background:conic-gradient(from -32deg,rgba(255,209,102,.6) 0deg 64deg,transparent 64deg)}
body[data-theme=night] .cone{background:conic-gradient(from -32deg,rgba(111,152,255,.6) 0deg 64deg,transparent 64deg)}
@media (prefers-reduced-motion:reduce){.me::before{animation:none;opacity:.5}}

/* note card */
#card{position:fixed;left:8px;right:8px;bottom:calc(var(--safe-b) + 8px);margin:0 auto;max-width:520px;z-index:30;max-height:70vh;overflow-y:auto;overscroll-behavior:contain;
  background-color:var(--paper);color:var(--paper-ink);border-radius:4px 4px 14px 14px;box-shadow:0 12px 40px rgba(0,0,0,.38);
  background-image:linear-gradient(90deg,transparent 40px,var(--margin) 40px,var(--margin) 41.5px,transparent 41.5px),repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);
  background-position:0 0,0 14px;padding:14px 16px 18px 54px;transform:translateY(calc(100% + 40px));transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#card.on{transform:none}
#card .x{position:absolute;top:6px;right:8px;border:0;background:none;color:var(--paper-ink);font-size:30px;width:40px;height:40px;line-height:1}
.c-grp{font-size:16px;color:var(--paper-muted);display:flex;align-items:center;gap:7px;margin-right:36px}
.c-grp i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.c-title{font-family:var(--hand);font-weight:700;font-size:28px;line-height:1.1;margin:2px 36px 6px 0}
.c-title .s{color:var(--star);font-size:20px;vertical-align:3px}
.hrs{display:inline-block;font-size:14px;line-height:1.25;color:#166534;background:#ecfdf3;border:1px solid #bbf7d0;border-radius:10px;padding:1px 8px;margin:0 4px 4px 0}
.now{font-size:16px;margin-left:2px}
.now.o{color:#15803d}.now.c{color:#c2410c}
.c-dist{font-size:16px;color:var(--paper-muted);margin:2px 0 4px}
.c-note{font-size:19px;line-height:32px;color:var(--paper-ink);margin:0}
.c-warn{font-size:16px;color:var(--star);line-height:1.3;margin:6px 0 0}
.c-warn::before{content:"↳ "}
.c-booked{display:inline-block;border:1.6px solid var(--paper-ink);border-radius:50%;padding:8px 16px;transform:rotate(-3deg);font-family:var(--hand);font-size:17px;font-weight:700;margin:8px 0 2px}
.c-approx{font-size:14px;color:var(--paper-muted);margin-top:6px}
.c-plan{font-size:16px;color:var(--paper-muted);margin-top:4px}
.c-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hb{font-family:var(--print);font-size:18px;color:var(--paper-ink);background:transparent;border:1.6px solid var(--paper-ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;padding:6px 15px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.hb.fill{background:var(--paper-ink);color:var(--paper)}
.hb svg{width:18px;height:18px;fill:currentColor}

/* nav HUD */
#navTop{position:fixed;top:calc(var(--safe-t) + 8px);left:8px;right:8px;max-width:560px;z-index:25;display:flex;gap:14px;align-items:center;background:var(--hud);color:var(--hud-t);border-radius:18px;padding:12px 16px;box-shadow:var(--sh)}
#turnIcon{width:52px;height:52px;fill:currentColor;flex:none;transition:transform .25s}
.nt-dist{font-size:32px;line-height:1;font-weight:700}
.nt-text{font-size:20px;line-height:1.2;opacity:.92}
#navBot{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;z-index:25;background:var(--ui);color:var(--text);border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.2);padding:12px 16px calc(var(--safe-b) + 12px)}
.nb-eta{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.nb-eta b{font-size:28px;color:var(--ok);font-weight:700}
.nb-eta span{font-size:18px;color:var(--muted)}
.nb-to{font-size:17px;margin:2px 0 10px;color:var(--text)}
.nb-btns{display:flex;flex-wrap:wrap;gap:8px}
.nb-btns .btn[aria-pressed=true]{background:var(--ink);color:var(--ui)}
.nb-btns .end{border-color:var(--no);color:var(--no);margin-left:auto}
#btnRecenter{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sheet-h) + 14px);z-index:26;border:0;border-radius:22px;background:var(--ui);color:var(--ink);box-shadow:var(--sh);padding:10px 20px;font-size:18px}
#simBadge{position:fixed;left:12px;top:calc(var(--safe-t) + 110px);z-index:19;background:var(--star);color:#fff;border-radius:14px;padding:4px 12px;font-size:15px;border:0;box-shadow:var(--sh)}
body.navving #simBadge{top:calc(var(--safe-t) + 112px)}

#toast{position:fixed;left:50%;top:calc(var(--safe-t) + 104px);transform:translate(-50%,-14px);opacity:0;z-index:40;background:var(--hud);color:var(--hud-t);padding:9px 16px;border-radius:14px;font-size:17px;max-width:88vw;text-align:center;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:var(--sh)}
#toast.on{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
@media (min-width:700px){#top{left:16px}#sheet{left:16px;right:auto;margin:0;width:420px}#card{left:450px;right:16px;margin:0;bottom:16px}}
</style>
</head>
<body data-theme="day">
<div id="map" aria-label="Map"></div>

<header id="top">
  <div class="search">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 0 1 5.6 11.2l5 5-1.4 1.4-5-5A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
    <input id="q" type="search" placeholder="Search your places or an address" enterkeyhint="search" autocomplete="off" aria-label="Search">
    <button id="qx" aria-label="Clear search" hidden>×</button>
  </div>
  <div class="chips" id="cityChips"></div>
  <div id="results" class="results" hidden></div>
</header>

<div id="rail">
  <button class="fab" id="btnTheme" aria-label="Change map style"></button>
  <button class="fab" id="btnNorth" aria-label="Reset north" hidden><svg class="ico" viewBox="0 0 24 24"><path d="M12 2 7 13h10z" fill="#d03a3a"/><path d="M12 22l5-9H7z" opacity=".45"/></svg></button>
</div>
<button class="fab" id="btnLocate" aria-label="Show my location"></button>
<button id="simBadge" hidden>Test drive on · tap to stop</button>
<button id="btnRecenter" hidden>Re-centre</button>

<section id="sheet" aria-label="Places and plans">
  <div class="grab" id="grab">
    <div class="handle"></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="near" aria-selected="true">Near me</button>
      <button class="tab" role="tab" data-tab="plans" aria-selected="false">Plans</button>
      <button class="tab" role="tab" data-tab="notes" aria-selected="false">Notes</button>
    </div>
  </div>
  <div class="sbody" id="sbody"></div>
</section>

<div id="card" role="dialog" aria-modal="false" aria-label="Place notes"></div>

<div id="navTop" hidden>
  <svg id="turnIcon" viewBox="0 0 24 24"></svg>
  <div><div class="nt-dist" id="ntDist"></div><div class="nt-text" id="ntText">Finding the way…</div></div>
</div>
<div id="navBot" hidden>
  <div class="nb-eta"><b id="nbMin">–</b><span id="nbDist"></span><span id="nbClock"></span></div>
  <div class="nb-to" id="nbTo"></div>
  <div class="nb-btns">
    <button class="btn" id="nbVoice" aria-pressed="false">Voice</button>
    <button class="btn" id="nbWake" aria-pressed="false">Screen on</button>
    <button class="btn" id="nbSkip">Skip stop</button>
    <a class="btn" id="nbG" target="_blank" rel="noopener">Google Maps</a>
    <button class="btn end" id="nbEnd">End</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>This map needs JavaScript turned on.</noscript>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- groups ---------- */
const G={
  fri:{c:'#2d5bd8',label:'Brussels, Friday',city:'Brussels'},
  bxl:{c:'#2d5bd8',label:'Brussels, your base',city:'Brussels'},
  mon:{c:'#7b4fd6',label:'Brussels, Monday',city:'Brussels'},
  gent:{c:'#0e8f72',label:'Gent, day trip',city:'Gent'},
  antw:{c:'#d03a6c',label:'Antwerpen, day trip',city:'Antwerpen'},
  brug:{c:'#c98410',label:'Bruges, day trip',city:'Brugge'}
};
const CITIES=[
  {k:'bxl',label:'Brussels',c:'#2d5bd8',center:[4.3555,50.8435],z:13.7},
  {k:'gent',label:'Gent',c:'#0e8f72',center:[3.7245,51.0480],z:13.7},
  {k:'antw',label:'Antwerpen',c:'#d03a6c',center:[4.4040,51.2195],z:14},
  {k:'brug',label:'Bruges',c:'#c98410',center:[3.2250,51.2050],z:14},
  {k:'ride',label:'Bike rides',c:'#c98410',center:[3.300,51.275],z:10.6}
];

/* ---------- icons ---------- */
const IP={
  sight:'M12 6.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z',

function parseH(code){

}

const R2=Math.PI/180;
function hav(a,b){const dLat=(b.lat-a.lat)*R2,dLng=(b.lng-a.lng)*R2,s=Math.sin(dLat/2)**2+Math.cos(a.lat*R2)*Math.cos(b.lat*R2)*Math.sin(dLng/2)**2;return 12742000*Math.asin(Math.min(1,Math.sqrt(s)))}
const havLL=(a,b)=>hav({lat:a[1],lng:a[0]},{lat:b[1],lng:b[0]});
function bearing(a,b){const y=Math.sin((b[0]-a[0])*R2)*Math.cos(b[1]*R2),x=Math.cos(a[1]*R2)*Math.sin(b[1]*R2)-Math.sin(a[1]*R2)*Math.cos(b[1]*R2)*Math.cos((b[0]-a[0])*R2);return(Math.atan2(y,x)/R2+360)%360}

/* ---------- opening hours ---------- */
const DK={0:'u',1:'m',5:'f',6:'s'};
function openState(p,now=new Date()){
  const h=p.hours; if(!h) return null; if(h==='A') return{open:true,txt:'open'};
  const mins=now.getHours()*60+now.getMinutes(), k=DK[now.getDay()], yk=DK[(now.getDay()+6)%7];
  if(yk&&h[yk]) for(const[,b] of h[yk]) if(b>1440&&mins<b-1440) return{open:true,txt:`open now, until ${fmtT(b-1440)}`};
  if(!k||!(k in h)) return null;
  const rs=h[k]; if(!rs.length) return{open:false,txt:'closed today'};
  for(const[a,b] of rs) if(mins>=a&&mins<b) return{open:true,txt:`open now, until ${fmtT(b%1440||1440)}`};
  const nx=rs.find(([a])=>a>mins); return nx?{open:false,txt:`opens ${fmtT(nx[0])}`}:{open:false,txt:'closed now'};
}

let watchId=null,firstFix=true;
function startGPS(loud){
  if(sim.on)return;

  if(watchId!=null)return;
  if(loud)toast('Finding you…');
  watchId=navigator.geolocation.watchPosition(onPos,err=>{
    if(err.code===1){toast('Location is blocked. Allow it for this site in your phone settings.');navigator.geolocation.clearWatch(watchId);watchId=null;followMode=0;updateLocBtn()}
    else if(loud)toast('Still looking for GPS…');

}
function stopGPS(){if(watchId!=null)navigator.geolocation.clearWatch(watchId);watchId=null}
function onPos(pos){if(sim.on)return;const c=pos.coords;
  updateMe({lat:c.latitude,lng:c.longitude,acc:c.accuracy||30,gpsHeading:(c.heading!=null&&!isNaN(c.heading))?c.heading:null,speed:c.speed||0})}

  if('ondeviceorientationabsolute' in window)addEventListener('deviceorientationabsolute',onOrient,true);else addEventListener('deviceorientation',onOrient,true)}
let headRAF=0;
function onOrient(e){let h=null;

  else if(e.alpha!=null&&(e.absolute||e.type==='deviceorientationabsolute'))h=(360-e.alpha)%360;
  if(h==null)return;

  compass=lerpAng(compass,(h+sa+360)%360,.25);
  if(!headRAF)headRAF=requestAnimationFrame(()=>{headRAF=0;renderHeading()});
}
function effHeading(){if(me&&me.gpsHeading!=null&&me.speed>1.4)return me.gpsHeading;return compass}
function renderHeading(){if(!meShown)return;const h=effHeading();coneEl.style.display=h==null?'none':'';if(h!=null)coneM.setRotation(h)}

function updateMe(m){

    if(followMode)map.jumpTo({center:[m.lng,m.lat],zoom:Math.max(map.getZoom(),15.5)});

}

/* ---------- routing (OSRM, FOSSGIS servers) ---------- */
const ROUTER={foot:'https://routing.openstreetmap.de/routed-foot/route/v1/driving/',bike:'https://routing.openstreetmap.de/routed-bike/route/v1/driving/'};
async function osrm(pts,mode){
  const url=ROUTER[mode]+pts.map(p=>p[0].toFixed(6)+','+p[1].toFixed(6)).join(';')+'?overview=full&geometries=geojson&steps=true';
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),15000);
  try{const r=await fetch(url,{signal:ctl.signal});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();
    if(j.code!=='Ok'||!j.routes||!j.routes.length)throw new Error(j.code||'no route');
    const rt=j.routes[0];return{coords:rt.geometry.coordinates,steps:rt.legs.flatMap(l=>l.steps),dist:rt.distance,dur:rt.duration,straight:false}}
  finally{clearTimeout(to)}
}
function straightRoute(a,b){const d=havLL(a,b);return{coords:[a,b],steps:[{maneuver:{type:'depart',location:a,bearing_after:bearing(a,b)},name:''},{maneuver:{type:'arrive',location:b},name:''}],dist:d,dur:d/1.3,straight:true}}
function prep(r){
  const c=r.coords,cum=[0];for(let i=1;i<c.length;i++)cum.push(cum[i-1]+havLL(c[i-1],c[i]));
  const mi=[];let from=0;
  r.steps.forEach(s=>{const L=s.maneuver.location;let best=1e18,bi=from;for(let i=from;i<c.length;i++){const d=(c[i][0]-L[0])**2+(c[i][1]-L[1])**2;if(d<best){best=d;bi=i}}mi.push(bi);from=bi});
  return{...r,cum,mi,total:cum[cum.length-1]||0};
}
function snap(R,pt){
  const c=R.coords;if(c.length<2)return{dist:hav(pt,{lng:c[0][0],lat:c[0][1]}),along:0};
  const kx=Math.cos(pt.lat*R2)*111320,ky=110540;let best=1e18,bi=0,bt=0;
  for(let i=0;i<c.length-1;i++){const ax=(c[i][0]-pt.lng)*kx,ay=(c[i][1]-pt.lat)*ky,bx=(c[i+1][0]-pt.lng)*kx,by=(c[i+1][1]-pt.lat)*ky,dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy;
    let t=L?-(ax*dx+ay*dy)/L:0;t=Math.max(0,Math.min(1,t));const px=ax+t*dx,py=ay+t*dy,d=px*px+py*py;if(d<best){best=d;bi=i;bt=t}}
  return{dist:Math.sqrt(best),along:R.cum[bi]+bt*(R.cum[bi+1]-R.cum[bi])};
}
function pointAt(R,along){const c=R.coords;if(c.length<2)return{lng:c[0][0],lat:c[0][1],b:0};
  let i=R.cum.findIndex(v=>v>=along);if(i<=0)i=1;if(i===-1||along>=R.total)i=c.length-1;
  const seg=R.cum[i]-R.cum[i-1]||1,t=Math.max(0,Math.min(1,(along-R.cum[i-1])/seg));
  return{lng:c[i-1][0]+(c[i][0]-c[i-1][0])*t,lat:c[i-1][1]+(c[i][1]-c[i-1][1])*t,b:bearing(c[i-1],c[i])}}

/* turn instructions */
const ANG={straight:0,'slight right':40,right:90,'sharp right':135,uturn:180,'sharp left':-135,left:-90,'slight left':-40};
function instr(s,tgt){
  const m=s.maneuver,t=m.type,mod=m.modifier||'',on=s.name?` onto ${s.name}`:'';
  if(t==='arrive')return`Arrive at ${tgt}`;
  if(t==='depart')return`Head ${compassWord(m.bearing_after||0)}${s.name?` on ${s.name}`:''}`;
  if(t==='roundabout'||t==='rotary'||t==='roundabout turn')return`At the roundabout, take exit ${m.exit||1}${on}`;
  if(t==='fork')return`Keep ${mod.includes('left')?'left':'right'}${on}`;
  if(t==='end of road')return`At the end of the road, turn ${mod.includes('left')?'left':'right'}${on}`;
  if(t==='new name'||t==='continue'||mod==='straight')return s.name?`Continue onto ${s.name}`:'Continue straight';
  const w={left:'Turn left',right:'Turn right','slight left':'Bear left','slight right':'Bear right','sharp left':'Turn sharp left','sharp right':'Turn sharp right',uturn:'Make a U-turn'};
  return(w[mod]||'Continue')+on;
}
function turnSVG(s){const t=s.maneuver.type;
  if(t==='arrive')return'<path d="M5 2h2v20H5zM8 3h11l-3 4.5 3 4.5H8z"/>';
  if(t==='roundabout'||t==='rotary')return'<path d="M12 5a7 7 0 1 1-6.9 8.2h2.1A5 5 0 1 0 12 7zM11 7V1l4 3z"/><path d="M11 13h2v9h-2z"/>';
  if(t==='depart')return'<path d="M12 2 4.5 21 12 17l7.5 4z"/>';
  if(s.maneuver.modifier==='uturn')return'<path d="M8 22V9a5 5 0 0 1 10 0v4h3l-4 5-4-5h3V9a3 3 0 0 0-6 0v13z"/>';
  return'<path d="M12 2 5 10h4.6v12h4.8V10H19z"/>';}
function turnAngle(s){const t=s.maneuver.type;if(t==='arrive'||t==='roundabout'||t==='rotary'||t==='depart'||s.maneuver.modifier==='uturn')return 0;return ANG[s.maneuver.modifier]||0}

/* ---------- navigation ---------- */
async function startNav(stops,idx,mode,planId){
  if(!me){requestCompass();followMode=2;startGPS(true);toast('Turn on your location to start');return}
  const tgt=stops[idx],far=hav(me,tgt);
  if(far>60000){toast(`That’s ${fmtDist(far)} away. Use “Test drive” in Plans, or open it in Google Maps.`,5200);return}
  closeCard();hideResults();
  nav={stops,idx,mode,planId,route:null,lastRe:0,spoken:{},busy:false};
  document.body.classList.add('navving');
  $('#top').hidden=true;$('#rail').hidden=true;$('#sheet').classList.add('gone');
  $('#navTop').hidden=false;$('#navBot').hidden=false;$('#nbSkip').hidden=stops.length-idx<2;
  requestAnimationFrame(()=>document.documentElement.style.setProperty('--sheet-h',$('#navBot').offsetHeight+'px'));
  ['plan-l','plan-ls'].forEach(l=>map.getLayer(l)&&map.setPaintProperty(l,'line-opacity',.45));if(map.getLayer('plan-c'))map.setPaintProperty('plan-c','line-opacity',.5);
  followMode=2;updateLocBtn();
  if(!wantWake)setWake(true);
  await navRoute();
  camTick(true);
}
async function navRoute(){
  if(!nav||nav.busy)return;nav.busy=true;nav.lastRe=Date.now();
  const tgt=nav.stops[nav.idx],a=[me.lng,me.lat],b=[tgt.lng,tgt.lat];
  $('#ntText').textContent='Finding the way…';
  let r;try{r=await osrm([a,b],nav.mode)}catch(e){r=straightRoute(a,b);toast('No route service right now, showing a straight line')}
  if(!nav){return}
  nav.route=prep(r);nav.spoken={};nav.busy=false;sim.route=null;
  setSrc('nav',{type:'Feature',geometry:{type:'LineString',coordinates:r.coords}});
  $('#nbG').href=gmapsURL([tgt],nav.mode);
  navUpdate();
}
function navUpdate(){
  if(!nav||!nav.route||!me)return;
  const R=nav.route,tgt=nav.stops[nav.idx];
  if(hav(me,tgt)<28)return arrive();
  const s=snap(R,me);
  if(s.dist>45&&Date.now()-nav.lastRe>12000&&!nav.busy){navRoute();return}
  let k=R.steps.findIndex((st,j)=>j>0&&R.cum[R.mi[j]]>s.along+4);if(k<0)k=R.steps.length-1;
  const st=R.steps[k],toMan=Math.max(0,R.cum[R.mi[k]]-s.along),remain=Math.max(0,R.total-s.along);
  const txt=instr(st,tgt.n),ti=$('#turnIcon');
  ti.innerHTML=turnSVG(st);ti.style.transform=`rotate(${turnAngle(st)}deg)`;
  $('#ntDist').textContent=fmtDist(toMan);$('#ntText').textContent=txt;
  const mins=minsFor(remain,nav.mode);
  $('#nbMin').textContent=fmtMin(mins);$('#nbDist').textContent=fmtDist(remain);$('#nbClock').textContent='arrive '+clock(new Date(Date.now()+mins*60000));
  const pl=nav.planId?PLI[nav.planId]:null;
  $('#nbTo').innerHTML=`to <b>${esc(tgt.n)}</b>${pl?` · stop ${nav.idx+1} of ${pl.stops.length}`:''}${R.straight?' · straight line':''}`;
  if(!nav.spoken[k+'f']&&toMan<160&&toMan>60){nav.spoken[k+'f']=1;speak(`In ${Math.round(toMan/10)*10} metres, ${txt.charAt(0).toLowerCase()+txt.slice(1)}`)}
  if(!nav.spoken[k+'n']&&toMan<=35){nav.spoken[k+'n']=1;speak(txt)}
}
function arrive(){
  const tgt=nav.stops[nav.idx];toast(`You’re at ${tgt.n}`);speak(`You have arrived at ${tgt.n}`);
  let n=nav.idx+1;while(n<nav.stops.length&&nav.stops[n].id===tgt.id&&nav.stops.length-n>1)n++;
  if(n<nav.stops.length){nav.idx=n;$('#nbSkip').hidden=nav.stops.length-n<2;navRoute()}
  else{const done=nav;endNav();toast(done.planId?'That was the last stop. Nice day!':`You’re at ${tgt.n}`)}
}
function endNav(){
  nav=null;setSrc('nav',EMPTY);document.body.classList.remove('navving');
  $('#top').hidden=false;$('#rail').hidden=false;$('#sheet').classList.remove('gone');
  $('#navTop').hidden=true;$('#navBot').hidden=true;$('#btnRecenter').hidden=true;
  ['plan-l','plan-ls'].forEach(l=>map.getLayer(l)&&map.setPaintProperty(l,'line-opacity',.95));if(map.getLayer('plan-c'))map.setPaintProperty('plan-c','line-opacity',.9);
  setSheet(sheetH,false);setWake(false);
  if(followMode)followMode=1;updateLocBtn();
  map.easeTo({pitch:0,bearing:0,padding:{top:0,bottom:0,left:0,right:0},duration:600});
  if(sim.on)simStop();
}
$('#nbEnd').onclick=endNav;
$('#nbSkip').onclick=()=>{if(!nav)return;if(nav.idx<nav.stops.length-1){nav.idx++;$('#nbSkip').hidden=nav.stops.length-nav.idx<2;toast(`Next: ${nav.stops[nav.idx].n}`);navRoute()}};

/* test drive (simulated location) */
function simStart(at){
  stopGPS();sim.on=true;sim.along=0;sim.route=null;$('#simBadge').hidden=false;
  updateMe({lat:at.lat,lng:at.lng,acc:6,gpsHeading:null,speed:0});
  clearInterval(sim.timer);sim.timer=setInterval(simTick,1000);
}
function simTick(){
  if(!nav||!nav.route||nav.busy)return;const R=nav.route;
  if(sim.route!==R){sim.route=R;sim.along=snap(R,me).along}
  sim.along+=nav.mode==='bike'?40:14;
  const p=pointAt(R,Math.min(sim.along,R.total));
  updateMe({lat:p.lat,lng:p.lng,acc:6,gpsHeading:p.b,speed:3});
}
function simStop(){clearInterval(sim.timer);sim.on=false;$('#simBadge').hidden=true;me=null;meShown=false;meM.remove();coneM.remove();setSrc('acc',EMPTY);firstFix=true;if(nav)endNav();startGPS(false);renderSheet()}
$('#simBadge').onclick=simStop;

/* ---------- Google Maps hand-off ---------- */
function gmapsURL(stops,mode){
  const enc=p=>p.temp?`${p.lat},${p.lng}`:encodeURIComponent(p.q);
  const dest=stops[stops.length-1];let u=`https://www.google.com/maps/dir/?api=1&destination=${enc(dest)}&travelmode=${mode==='bike'?'bicycling':'walking'}`;
  const wp=stops.slice(0,-1).slice(0,3);if(wp.length)u+='&waypoints='+wp.map(enc).join('%7C');return u;
}

/* ---------- note card ---------- */
function planInfo(p){const out=[];PLANS.forEach(pl=>{const i=pl.stops.findIndex(([id])=>id===p.id);if(i>=0)out.push(`Stop ${i+1} on ${pl.title}${pl.stops[i][1]?`, ${pl.stops[i][1]}`:''}`)});return out}
function openCard(p,fromMap){
  cardPlace=p;select(p.temp?null:p.id);
  const g=p.temp?null:G[p.g],os=p.temp?null:openState(p),d=me?hav(me,p):null;
  const pi=p.temp?[]:planInfo(p);
  $('#card').innerHTML=`
    <button class="x" aria-label="Close">×</button>
    ${g?`<div class="c-grp" style="--c:${g.c}"><i></i>${esc(g.label)}</div>`:`<div class="c-grp">${esc(p.sub||'Dropped pin')}</div>`}
    <h3 class="c-title">${esc(p.n)}${p.s?' <span class="s" title="From your notes">★</span>':''}</h3>
    ${p.ht||(os&&p.hours!=='A')?`<div>${p.ht?`<span class="hrs">${esc(p.ht)}</span>`:''}${os&&p.hours!=='A'?`<span class="now ${os.open?'o':'c'}">${esc(os.txt)}</span>`:''}</div>`:''}
    ${d!=null?`<div class="c-dist">${fmtDist(d)} away${d<15000?` · ${fmtMin(minsFor(d,'foot'))} on foot · ${fmtMin(minsFor(d,'bike'))} by bike`:''}</div>`:''}
    ${p.b?`<div class="c-booked">${esc(p.b)}</div>`:''}
    ${p.note?`<p class="c-note">${esc(p.note)}</p>`:''}
    ${p.w?`<p class="c-warn">${esc(p.w)}</p>`:''}
    ${pi.map(t=>`<div class="c-plan">${esc(t)}</div>`).join('')}
    ${p.a?`<div class="c-approx">Pin is approximate. Google Maps will find the exact door.</div>`:''}
    <div class="c-actions">
      <button class="hb fill" data-go="foot">${UI.walk}Walk here</button>
      <button class="hb" data-go="bike">Bike here</button>
      <a class="hb" href="${gmapsURL([p],'foot')}" target="_blank" rel="noopener">${UI.ext}Google Maps</a>
      ${p.u?`<a class="hb" href="${esc(p.u)}" target="_blank" rel="noopener">Info</a>`:''}
    </div>`;
  $('#card').classList.add('on');$('#card').scrollTop=0;
  $('#card .x').onclick=closeCard;
  $('#card').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>startNav([p],0,b.dataset.go,null));
  if(followMode){followMode=0;updateLocBtn()}
  const h=$('#card').offsetHeight;
  map.easeTo({center:[p.lng,p.lat],offset:[0,-Math.min(h/2,innerHeight*.3)],zoom:Math.max(map.getZoom(),fromMap?map.getZoom():15.5),duration:500});
}
function closeCard(){$('#card').classList.remove('on');select(null);cardPlace=null;if(tempMarker){tempMarker.remove();tempMarker=null}}
function dropPin(ll,name,sub){
  if(nav)return;clearTimeout(lp);
  if(tempMarker)tempMarker.remove();
  const el=document.createElement('div');el.className='mk sel';el.innerHTML=`<div class="pin temp"><span class="pin-in">${icon('pin')}</span></div>`;
  tempMarker=new maplibregl.Marker({element:el,anchor:'bottom',offset:[0,-6]}).setLngLat(ll).addTo(map);
  const p={temp:true,n:name||'Dropped pin',sub:sub||`${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`,lat:ll.lat,lng:ll.lng};
  const keep=tempMarker;openCard(p,true);tempMarker=keep;
}

/* ---------- bottom sheet ---------- */
const sheet=$('#sheet');let snaps=[],sheetH=0;
function computeSnaps(){const H=innerHeight;snaps=[160,Math.round(H*.48),Math.round(H*.86)];sheet.style.height=snaps[2]+'px'}
function setSheet(h,anim=true){
  if(typeof h!=='number'||!snaps.length)h=snaps[0];
  sheetH=h;sheet.style.transition=anim?'transform .28s cubic-bezier(.2,.8,.2,1)':'none';
  sheet.style.transform=`translateY(${snaps[2]-h}px)`;
  if(!nav)document.documentElement.style.setProperty('--sheet-h',h+'px');
}
computeSnaps();setSheet(snaps[0],false);
addEventListener('resize',()=>{const i=snaps.indexOf(sheetH);computeSnaps();setSheet(snaps[Math.max(0,i)],false)});
(()=>{const g=$('#grab');let y0=null,h0=0,moved=false,t0=0;
  g.addEventListener('pointerdown',e=>{y0=e.clientY;h0=sheetH;moved=false;t0=Date.now()});
  g.addEventListener('pointermove',e=>{if(y0==null)return;const dy=y0-e.clientY;if(!moved&&Math.abs(dy)>6){moved=true;try{g.setPointerCapture(e.pointerId)}catch(_){}}if(moved)setSheet(Math.max(snaps[0]-40,Math.min(snaps[2],h0+dy)),false)});
  const up=e=>{if(y0==null)return;const dy=y0-e.clientY,v=dy/Math.max(1,Date.now()-t0);y0=null;
    if(!moved){if(!e.target.closest('.tab')){const i=snaps.indexOf(h0);setSheet(snaps[i===0?1:0])}return}
    let tgt;if(Math.abs(v)>.5){const i=snaps.findIndex(s=>s>=h0-1);tgt=snaps[Math.max(0,Math.min(2,(i<0?0:i)+(v>0?1:-1)))]}
    else tgt=snaps.reduce((a,b)=>Math.abs(b-sheetH)<Math.abs(a-sheetH)?b:a);
    setSheet(tgt)};
  g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up);
})();
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));if(sheetH===snaps[0])setSheet(snaps[1]);renderSheet()});

/* near list */
let lastNear=0;
const FILTERS=[['all','Everything'],['food','Food & drink'],['see','Sights'],['open','Open now'],['star','★ From my notes']];
const isFood=p=>['food','coffee','bar'].includes(p.t);
function refreshNear(){lastNear=Date.now();if(tab==='near')renderSheet()}
function nearHTML(){
  let ref=me,label='Closest to you';
  if(!me||Math.min(...P.map(p=>hav(me,p)))>50000){const c=map.getCenter();ref={lat:c.lat,lng:c.lng};label=me?'You’re far away, so these are near the map centre':'Near the map centre. Tap ◎ to use your location'}
  let list=P.map(p=>({p,d:hav(ref,p),o:openState(p)}));
  if(nearFilter==='food')list=list.filter(x=>isFood(x.p));
  if(nearFilter==='see')list=list.filter(x=>!isFood(x.p));
  if(nearFilter==='open')list=list.filter(x=>x.o&&x.o.open);
  if(nearFilter==='star')list=list.filter(x=>x.p.s);
  list.sort((a,b)=>a.d-b.d);list=list.slice(0,30);
  return`<div class="filters">${FILTERS.map(([k,l])=>`<button class="flt" data-f="${k}" aria-pressed="${nearFilter===k}">${l}</button>`).join('')}</div>
    <p class="ref">${label}</p>
    ${list.length?list.map(({p,d,o})=>`<button class="row" data-id="${p.id}"><span class="dot" style="--c:${G[p.g].c}">${icon(p.t)}</span>
      <span class="mid"><span class="nm">${esc(p.n)}${p.s?' <span style="color:var(--star)">★</span>':''}</span><br><span class="sub">${esc(G[p.g].city)}${o&&p.hours!=='A'?` · <span class="${o.open?'st-open':'st-closed'}">${esc(o.txt)}</span>`:p.ht?` · ${esc(p.ht)}`:''}</span></span>
      <span class="d">${fmtDist(d)}<small>${fmtMin(minsFor(d,'foot'))} walk</small></span></button>`).join(''):'<p class="ref">Nothing matches here. Try another filter.</p>'}`;
}
/* plans */
const planRoutes={};
function plansHTML(){
  if(activePlan){const pl=PLI[activePlan],r=planRoutes[activePlan];
    return`<button class="back" id="plBack">‹ All plans</button>
    <div class="plan" style="--c:${G[pl.g].c};border:0;padding-bottom:6px"><h3><i></i>${esc(pl.title)}</h3><p>${esc(pl.sub)}${r?` Route: ${fmtDist(r.dist)}, about ${fmtMin(minsFor(r.dist,pl.mode))} of ${pl.mode==='bike'?'riding':'walking'}.`:''}</p>
    <div class="btns"><button class="btn fill" data-start="${pl.id}">Start from stop 1</button><button class="btn" data-sim="${pl.id}">Test drive</button></div></div>
    ${pl.stops.map(([id,t],i)=>{const p=PI[id],d=me?hav(me,p):null,hasT=pl.stops.some(x=>x[1]);return`<button class="row" data-id="${id}">${hasT?`<span class="time">${t||''}</span>`:''}<span class="dot" style="--c:${G[pl.g].c}">${i+1}</span>
      <span class="mid"><span class="nm">${esc(p.n)}</span>${p.ht?`<br><span class="sub">${esc(p.ht)}</span>`:''}</span>
      <span class="d" data-from="${i}" style="color:var(--ink)">${d!=null&&d<60000?fmtDist(d)+'<small>start here ›</small>':'<small>start here ›</small>'}</span></button>`}).join('')}`;}
  return PLANS.map(pl=>`<div class="plan" style="--c:${G[pl.g].c}"><h3><i></i>${esc(pl.title)}</h3><p>${esc(pl.sub)} ${pl.stops.length} stops, ${pl.mode==='bike'?'by bike':'on foot'}.</p>
    <div class="btns"><button class="btn fill" data-show="${pl.id}">Show on map</button><button class="btn" data-start="${pl.id}">Start</button><button class="btn" data-sim="${pl.id}">Test drive</button></div></div>`).join('')+
    `<p class="ref" style="margin-top:12px">Test drive pretends you’re standing at stop 1 and plays the navigation along the route, so you can try everything from home.</p>`;
}
async function showPlan(id,fit=true){
  activePlan=id;lastTab=null;LS.set('plan',id);renderPlanMarkers();
  const pl=PLI[id],pts=pl.stops.map(([s])=>[PI[s].lng,PI[s].lat]);
  if(fit){const b=new maplibregl.LngLatBounds();pts.forEach(p=>b.extend(p));map.fitBounds(b,{padding:{top:130,bottom:Math.min(sheetH,innerHeight*.5)+30,left:40,right:70},maxZoom:16,duration:700})}
  let r=planRoutes[id]||LS.get('rt3:'+id,null);
  if(!r){setSrc('plan',{type:'Feature',properties:{c:G[pl.g].c,straight:1},geometry:{type:'LineString',coordinates:pts}});
    try{const o=await osrm(pts,pl.mode);r={coords:o.coords,dist:o.dist};LS.set('rt3:'+id,r)}catch(e){r={coords:pts,dist:pts.slice(1).reduce((s,p,i)=>s+havLL(pts[i],p),0),straight:1}}}
  planRoutes[id]=r;
  if(activePlan===id)setSrc('plan',{type:'Feature',properties:{c:G[pl.g].c,straight:r.straight?1:0},geometry:{type:'LineString',coordinates:r.coords}});
  if(tab==='plans')renderSheet();
}
function clearPlan(){activePlan=null;lastTab=null;LS.set('plan',null);renderPlanMarkers();setSrc('plan',EMPTY);renderSheet()}
function planStops(id){return PLI[id].stops.map(([s])=>PI[s])}
async function startPlan(id,from=0,simulate=false){
  if(activePlan!==id)showPlan(id,false);
  const stops=planStops(id);
  if(simulate){if(nav)endNav();simStart(stops[from]);startNav(stops,Math.min(from+1,stops.length-1),PLI[id].mode,id);return}
  if(!me){requestCompass();followMode=2;updateLocBtn();startGPS(true);toast('Turn on your location, then tap Start again');return}
  startNav(stops,from,PLI[id].mode,id);
}
/* notes */
const NOTES=`<div class="notes">
<h4>Trains between cities</h4><p>Use the <a href="https://www.belgiantrain.be" target="_blank" rel="noopener">SNCB app</a> and buy the ticket before you board. Weekend trips are automatically 30% cheaper.</p><p>Brussels › Gent about 30 min, › Antwerpen about 45 min, › Bruges about 1 h. Trains run several times an hour.</p>
<h4>Inside the cities</h4><p>Brussels (metro, tram, bus): tap your contactless card or phone on the validator every time you board. Free transfers within 60 min. App: <a href="https://www.stib-mivb.be" target="_blank" rel="noopener">STIB-MIVB</a>.</p><p>Gent, Antwerpen, Bruges: <a href="https://www.delijn.be/en/" target="_blank" rel="noopener">De Lijn</a>. Tap your card on the white terminal, €3 a ride, free transfers within 60 min.</p><p class="warn">One card for both of you works on De Lijn (up to 5 people), but not on STIB, so use one card each in Brussels.</p>
<h4>Taxis</h4><p>Uber works in all four cities and is the easiest. Bolt is a good backup. In Brussels you can also book Taxis Verts. Bruges has fewer app cars, so leave a bit of time on the way back to the station.</p>
<h4>Crossing into the Netherlands (Sluis)</h4><p>Schengen and the euro, so no border post. On the bike route it’s just a sign on the road. Dutch military police can still do random spot checks near the border, so both of you carry your ID card or passport.</p>
<h4>Book ahead</h4><p><a href="https://fine-arts-museum.be" target="_blank" rel="noopener">Magritte Museum</a> (Friday), <a href="https://www.museabrugge.be" target="_blank" rel="noopener">Bruges Belfry</a> (timed slots), <a href="https://visit.gent.be" target="_blank" rel="noopener">Gravensteen</a>, <a href="https://www.ruien.be/" target="_blank" rel="noopener">Ruien</a>, In the Mood dinner in Bruges.</p>
<h4>Money and the rest</h4><p>Cards work almost everywhere, but bring cash for the Marolles flea market and Kasteel Minnewater (both cash only). Emergency number: 112. Service is included, so rounding up is enough.</p>
<h4>Which town on which day?</h4>
<table><tr><th></th><th>Saturday</th><th>Sunday</th></tr>
<tr><td>Gent</td><td>everything open</td><td>De Krook &amp; Astro Boy closed, cathedral from 13:00</td></tr>
<tr><td>Antwerpen</td><td>everything open except Invincible</td><td>Shuk, Kamino, Dansing Chocola closed, cathedral from 13:00, but Boekenberg open</td></tr>
<tr><td>Bruges</td><td>everything open except Tante Marie</td><td>Adornes closed</td></tr></table>
<p>Antwerpen copes best with a Sunday, so if you’re unsure: Gent or Bruges on Saturday, Antwerpen on Sunday.</p>
<h4>Good to know</h4><p>Most museums close on Mondays, so all the indoor art is on Friday.</p><p class="warn">At night stick to the Grand-Place, Mont des Arts and Sablon, or take a taxi. The route skips Gare du Nord, Anderlecht and Cureghem, and avoids Midi and Porte de Hal after dark.</p>
<h4>Using this map</h4><p>Tap a pin for your notes. Long-press anywhere on the map to drop a pin and route there. ◎ follows you, tap it again to turn the map with you. During navigation, Voice reads the turns and Screen on stops the phone locking (handy on the bike mount).</p>
<p class="fine">Map data © OpenStreetMap contributors · tiles by OpenFreeMap / OpenMapTiles · routes by FOSSGIS OSRM · address search by Photon (komoot). Opening hours are from your notes; “open now” uses today’s day and time.</p></div>`;
let lastTab=null;
function renderSheet(){
  const b=$('#sbody'),st=lastTab===tab?b.scrollTop:0;lastTab=tab;
  b.innerHTML=tab==='near'?nearHTML():tab==='plans'?plansHTML():NOTES;
  b.querySelectorAll('.flt').forEach(x=>x.onclick=()=>{nearFilter=x.dataset.f;renderSheet()});
  b.querySelectorAll('.row').forEach(x=>x.onclick=e=>{const from=e.target.closest('[data-from]');if(from&&activePlan){startPlan(activePlan,+from.dataset.from);return}openCard(PI[x.dataset.id])});
  b.querySelectorAll('[data-show]').forEach(x=>x.onclick=()=>showPlan(x.dataset.show));
  b.querySelectorAll('[data-start]').forEach(x=>x.onclick=()=>startPlan(x.dataset.start,0));
  b.querySelectorAll('[data-sim]').forEach(x=>x.onclick=()=>startPlan(x.dataset.sim,0,true));
  const bk=$('#plBack');if(bk)bk.onclick=clearPlan;
  b.scrollTop=st;
}

/* ---------- city chips ---------- */
$('#cityChips').innerHTML=CITIES.map(c=>`<button class="chip" data-c="${c.k}" style="--c:${c.c}"><i></i>${c.label}</button>`).join('');
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const c=CITIES.find(x=>x.k===b.dataset.c);if(followMode){followMode=0;updateLocBtn()}closeCard();map.flyTo({center:c.center,zoom:c.z,bearing:0,pitch:0,duration:1400})});

/* ---------- search ---------- */
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let sTimer=null,sSeq=0;
function hideResults(){$('#results').hidden=true}
$('#q').addEventListener('input',()=>{const v=$('#q').value.trim();$('#qx').hidden=!v;clearTimeout(sTimer);if(!v){hideResults();return}renderResults(v,null);if(v.length>=3)sTimer=setTimeout(()=>photon(v),380)});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){const f=$('#results .row');if(f)f.click();$('#q').blur()}});
$('#qx').onclick=()=>{$('#q').value='';$('#qx').hidden=true;hideResults()};
let lastWeb=[];
function renderResults(v,web){
  if(web)lastWeb=web;const n=norm(v);
  const mine=P.filter(p=>norm(p.n+' '+p.note+' '+G[p.g].city).includes(n)).slice(0,8);
  const r=$('#results');r.hidden=false;
  r.innerHTML=`<h5>From your notes</h5>${mine.length?mine.map(p=>`<button class="row" data-id="${p.id}"><span class="dot" style="--c:${G[p.g].c}">${icon(p.t)}</span><span class="mid"><span class="nm">${esc(p.n)}</span><br><span class="sub">${esc(G[p.g].label)}</span></span></button>`).join(''):'<div class="empty">Nothing in your notes</div>'}
    <h5>Addresses &amp; places</h5>${(web||lastWeb).length?(web||lastWeb).map((w,i)=>`<button class="row" data-w="${i}"><span class="dot" style="--c:#8a8a8a">${icon('pin')}</span><span class="mid"><span class="nm">${esc(w.n)}</span><br><span class="sub">${esc(w.sub)}</span></span></button>`).join(''):`<div class="empty">${v.length<3?'Keep typing…':'Searching…'}</div>`}`;
  r.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{hideResults();$('#q').blur();openCard(PI[b.dataset.id])});
  r.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const w=lastWeb[+b.dataset.w];hideResults();$('#q').blur();dropPin({lat:w.lat,lng:w.lng},w.n,w.sub)});
}
async function photon(v){
  const seq=++sSeq,c=me||(()=>{const m=map.getCenter();return{lat:m.lat,lng:m.lng}})();
  try{const r=await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(v)}&lat=${c.lat.toFixed(4)}&lon=${c.lng.toFixed(4)}&limit=6&lang=en`);const j=await r.json();
    if(seq!==sSeq)return;
    const web=(j.features||[]).map(f=>{const p=f.properties||{};return{n:p.name||[p.street,p.housenumber].filter(Boolean).join(' ')||'Place',sub:[p.street&&p.name?[p.street,p.housenumber].filter(Boolean).join(' '):'',p.city||p.town||p.village||'',p.country||''].filter(Boolean).join(', '),lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0]}});
    if($('#q').value.trim()===v)renderResults(v,web);
  }catch(e){if(seq===sSeq&&$('#q').value.trim()===v)renderResults(v,[])}
}

addEventListener('keydown',e=>{if(e.key==='Escape'){closeCard();hideResults()}});
/* ---------- toast ---------- */
let tT=null;function toast(t,ms=2600){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>el.classList.remove('on'),ms)}

/* ---------- home-screen icon ---------- */
(()=>{try{const img=new Image();img.onload=()=>{const cv=document.createElement('canvas');cv.width=cv.height=180;const x=cv.getContext('2d');x.fillStyle='#fdfcf7';x.fillRect(0,0,180,180);x.drawImage(img,8,8,164,164);
  const l=document.createElement('link');l.rel='apple-touch-icon';l.href=cv.toDataURL('image/png');document.head.appendChild(l);
  const f=document.createElement('link');f.rel='icon';f.href=l.href;document.head.appendChild(f)};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(COUPLE.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" '))}catch(e){}})();

/* ---------- start ---------- */
renderSheet();
const savedPlan=LS.get('plan',null);if(savedPlan&&PLI[savedPlan]){activePlan=savedPlan;showPlan(savedPlan,false)}
if(navigator.permissions&&navigator.permissions.query){navigator.permissions.query({name:'geolocation'}).then(s=>{if(s.state==='granted')startGPS(false)}).catch(()=>{})}
setInterval(()=>{if(tab==='near'&&!nav)renderSheet()},60000);
})();
